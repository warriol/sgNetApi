<div class="roles-page">
  <!-- Toolbar Superior -->
  <div class="card mb-3">
    <div class="d-flex justify-content-between align-items-center">
      <h3 class="m-0">Gestión de Roles del Sistema</h3>
      <button class="btn btn-primary" (click)="abrirModalCrear()">+ Crear Nuevo Rol</button>
    </div>
  </div>

  <!-- Grilla de Tarjetas de Roles -->
  <div class="roles-grid">
    <div class="rol-card" *ngFor="let rol of listaRoles">
      <div class="rol-header">
        <h4>{{ rol.nombre }}</h4>
        <button class="btn btn-sm btn-secondary" (click)="abrirModalEditar(rol)">Editar</button>
      </div>

      <div class="rol-body">
        <span class="text-muted text-sm fw-bold">Permisos Asignados ({{ rol.permisos.length }}):</span>
        <div class="permisos-list">
          <span *ngFor="let p of rol.permisos" class="badge badge-permiso" [title]="p.descripcion">
            {{ p.nombre }}
          </span>
          <span *ngIf="rol.permisos.length === 0" class="text-muted text-sm italic">Sin permisos asociados.</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Formulario de Rol -->
  <div class="modal-overlay" *ngIf="mostrarModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>{{ modoEdicion ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h3>
        <button class="btn-close" (click)="cerrarModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="alert alert-danger" *ngIf="mensajeError">
          {{ mensajeError }}
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Nombre del Rol:</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Ej: Supervisor de Operaciones" 
            [(ngModel)]="nombreRol" 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Seleccionar Permisos del Catálogo:</label>
          <div class="permisos-selector">
            <label *ngFor="let perm of catalogoPermisos" class="checkbox-card">
              <input 
                type="checkbox" 
                [checked]="idsPermisosSeleccionados.includes(perm.idPermiso)" 
                (change)="togglePermiso(perm.idPermiso)" 
              />
              <div class="perm-info">
                <span class="perm-name">{{ perm.nombre }}</span>
                <span class="perm-desc">{{ perm.descripcion }}</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" (click)="guardarRol()" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Guardar Rol' }}
        </button>
      </div>
    </div>
  </div>
</div>
